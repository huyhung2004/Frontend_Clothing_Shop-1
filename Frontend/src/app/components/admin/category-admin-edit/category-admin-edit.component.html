<div class="modern-dialog">
  <div class="dialog-header">
    <div class="header-icon success">
      <i class="fas fa-edit"></i>
    </div>
    <div class="header-text">
      <h2 class="dialog-title">Chỉnh sửa danh mục</h2>
      <p class="dialog-subtitle">Cập nhật thông tin danh mục sản phẩm</p>
    </div>
  </div>

  <div mat-dialog-content class="dialog-content">
    <form #categoryForm="ngForm" (ngSubmit)="onSubmit()">
      <!-- Error Message Display -->
      <div *ngIf="errorMessage" class="error-banner">
        <i class="fas fa-exclamation-triangle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-tag"></i>
          Tên danh mục
          <span class="required">*</span>
        </label>
        <mat-form-field class="w-100" appearance="outline">
          <input 
            matInput 
            [(ngModel)]="category.name" 
            name="name" 
            required 
            maxlength="255"
            placeholder="Nhập tên danh mục..." />
          <mat-hint>Tối đa 255 ký tự</mat-hint>
        </mat-form-field>
      </div>

      <div mat-dialog-actions class="dialog-actions">
        <button 
          mat-button 
          class="btn-cancel" 
          type="button" 
          (click)="onCancel()" 
          [disabled]="isSubmitting">
          <i class="fas fa-times"></i>
          Hủy bỏ
        </button>
        <button 
          mat-raised-button 
          class="btn-update" 
          type="submit" 
          [disabled]="!category.name || isSubmitting">
          <i class="fas fa-save"></i>
          {{ isSubmitting ? 'Đang cập nhật...' : 'Cập nhật' }}
        </button>
      </div>
    </form>
  </div>
</div>
