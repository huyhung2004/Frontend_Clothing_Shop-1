<h2 mat-dialog-title class="dialog-title text-center">Deactivate User</h2>

<mat-dialog-content>
  <p class="text-center">Bạn có chắc chắn muốn vô hiệu hóa User này?</p>
</mat-dialog-content>

<mat-dialog-actions class="action-buttons">
  <div class="left-buttons">
    <button mat-button class="delete-button" (click)="onDelete()">Deactivate</button>
  </div>
  <div class="right-buttons">
    <button mat-button class="cancel-button" type="button" (click)="onCancel()">Cancel</button>
  </div>
</mat-dialog-actions>
