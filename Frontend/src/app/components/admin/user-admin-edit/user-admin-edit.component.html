<h2 mat-dialog-title class="center" style="font-size: 30px;">Edit User</h2>

<div mat-dialog-content>
  <form #userForm="ngForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="w-100">
      <mat-label>Fullname</mat-label>
      <input matInput [(ngModel)]="user.fullname" name="fullname" />
    </mat-form-field>

    <mat-form-field class="w-100">
      <mat-label>Phone Number</mat-label>
      <input matInput [(ngModel)]="user.phoneNumber" name="phoneNumber" required pattern="^[0-9]{10}$" maxlength="10"
        #phoneNumber="ngModel" />
      <mat-error *ngIf="phoneNumber.invalid && phoneNumber.touched">
        Phone number must be exactly 10 digits.
      </mat-error>
    </mat-form-field>



    <mat-form-field class="w-100">
      <mat-label>Facebook Account ID</mat-label>
      <input matInput type="number" [(ngModel)]="user.facebookAccountId" name="facebookAccountId" [disabled]="true" />
    </mat-form-field>

    <mat-form-field class="w-100">
      <mat-label>Google Account ID</mat-label>
      <input matInput type="number" [(ngModel)]="user.googleAccountId" name="googleAccountId" [disabled]="true" />
    </mat-form-field>

    <mat-form-field class="w-100">
      <mat-label>Role</mat-label>
      <select matNativeControl [(ngModel)]="user.roleId" name="roleId" required>
        <option *ngFor="let r of roles" [ngValue]="r.id">{{ r.name }}</option>
      </select>
    </mat-form-field>

    <mat-checkbox [(ngModel)]="user.isActive" name="isActive">Active</mat-checkbox>

    <div mat-dialog-actions class="action-buttons mt-3">
      <button mat-flat-button color="primary" class="save-button" type="submit"
        [disabled]="!userForm.valid || !user.roleId">
        Save
      </button>

      <button mat-button class="cancel-button" type="button" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
