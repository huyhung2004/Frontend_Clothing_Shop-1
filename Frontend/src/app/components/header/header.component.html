<!-- Cart Offcanvas -->
<div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="offcanvasCart">
  <div class="offcanvas-header justify-content-center">
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div class="order-md-last">
      <h4 class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-primary">Your cart</span>
        <span class="badge bg-primary rounded-pill">0</span>
      </h4>
      <ul class="list-group mb-3">
        <li class="list-group-item d-flex justify-content-between">
          <span>Total (USD)</span>
          <strong>$0</strong>
        </li>
      </ul>
      <button class="w-100 btn btn-primary btn-lg" type="button" routerLink="/cart">Continue to checkout</button>
    </div>
  </div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light text-white text-uppercase fs-6 p-3 border-bottom border-light align-items-center fixed-top border-opacity-10 inverted">
  <div class="container-fluid">
    <div class="row justify-content-between align-items-center w-100">
      <div class="col-auto">
        <a class="navbar-brand" routerLink="/home">
          <img src="assets/img/logo.png" alt="logo">
        </a>
      </div>

      <div class="col-auto">
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>

          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 gap-1 gap-md-5 pe-3">
              <li class="nav-item">
                <a class="nav-link" routerLink="/home" [class.active]="activeRoute('/home')">Trang Chủ</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/product" [class.active]="activeRoute('/product')">Sản Phẩm</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/cart" [class.active]="activeRoute('/cart')">Giỏ hàng</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/account" [class.active]="activeRoute('/account')">Quản lý</a>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <div class="col-3 col-lg-auto"> 
        <ul class="list-unstyled d-flex m-0">
          <li class="d-none d-lg-block">
            <!-- <a routerLink="/cart" class="text-uppercase mx-3" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCart" aria-controls="offcanvasCart">
              Cart <span class="cart-count">(0)</span>
            </a> -->
          </li>
          <li class="d-none d-lg-block">
            <app-useraccess></app-useraccess>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
